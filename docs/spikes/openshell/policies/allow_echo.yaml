# Spike policy: deny-all plus httpbin.org (echoes request headers) with TLS
# terminated at the OpenShell proxy, to test provider credential substitution.
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /proc
  - /dev/urandom
  - /app
  - /etc
  - /var/log
  read_write:
  - /sandbox
  - /tmp
  - /dev/null
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  echo:
    name: echo
    endpoints:
    - host: httpbin.org
      port: 443
      protocol: rest
      tls: terminate
      enforcement: enforce
      access: full
    binaries:
    - path: /sandbox/.venv/bin/python3
    - path: /sandbox/.uv/python/**
    - path: /usr/bin/curl
